[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mureg-rigid"
version = "0.2.0"
description = "MuReg and TCIA prostate MR-US rigid initialization for MONAI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "nibabel>=5.2",
  "vtk>=9.3",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
tcia = ["SimpleITK>=2.3", "filelock>=3.13"]
dicom = ["SimpleITK>=2.3", "filelock>=3.13", "pydicom>=3.0"]

[project.scripts]
mureg-rigid = "mureg_rigid.run:main"
tcia-rigid = "mureg_rigid.tcia_cli:main"
mureg-rigid-masks = "mureg_rigid.masks:main"
mureg-rigid-verify = "mureg_rigid.verify:main"
mureg-rigid-metrics = "mureg_rigid.metrics:main"

[tool.setuptools.packages.find]
where = ["src"]

